name: Update specifications from cron

on:
  schedule:
    - cron: '40 03 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cron-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.CRON_REPOSITORY_TOKEN }}

      - name: Run specification cron scripts
        shell: bash
        run: bash cron-all.sh

      - name: Commit and push changes
        shell: bash
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m 'chore: update specifications from cron scripts'
          git push
